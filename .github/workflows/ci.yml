name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Go Build, Race Tests & Docker Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./ticket-app-backend

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_TEST_NAME: ticket_test
      REDIS_ADDRESS: localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ticket-app-backend/go.mod
          cache-dependency-path: ticket-app-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run database migrations
        run: |
            for f in internal/database/migrations/*.up.sql; do
              echo "Applying $f..."
              PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_TEST_NAME -v ON_ERROR_STOP=1 -f "$f"
            done

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Build API binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o /dev/null ./cmd/api

      - name: Verify Docker image build
        working-directory: .
        run: docker build -t ticket-app-backend:ci ./ticket-app-backend